<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ReworkVLM Review{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('queue') }}"><span class="brand-mark" aria-hidden="true"></span>ReworkVLM Review</a>
    {% if g.user %}
    <div class="account">
      {% if g.user.role == 'adjudicator' %}<a href="{{ url_for('export') }}">Export reviews</a>{% endif %}
      <span>{{ g.user.username }}</span>
      <form method="post" action="{{ url_for('logout') }}">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <button class="quiet">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% for level, message in get_flashed_messages(with_categories=true) %}
      <p class="notice {{ level }}" role="status">{{ message }}</p>
    {% endfor %}
    {% block main %}{% endblock %}
  </main>
</body>
</html>
